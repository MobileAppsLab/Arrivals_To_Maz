<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Arrivals to Mazatlán</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:650px;margin:auto;min-height:100vh;background:#fff;padding:22px 16px 30px}
h1{text-align:center;margin:6px 0 3px;font-size:30px}.updated{text-align:center;color:#6b7280;font-size:14px;margin-bottom:20px}
.status{text-align:center;color:#92400e;padding:14px;background:#fffbeb;border-radius:12px;margin-bottom:14px}
.card{padding:15px 16px;margin:10px 0;border-radius:13px;background:#f8fafc;border:1px solid #e5e7eb}
.name{font-size:20px;font-weight:800;margin-bottom:5px}.date{font-weight:700;margin-bottom:5px}.notes{color:#4b5563;line-height:1.45}
.empty{text-align:center;color:#6b7280;padding:35px 10px}.refresh{width:100%;padding:13px;margin-top:12px;border:0;border-radius:11px;background:#0f766e;color:white;font-size:17px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<h1>Arrivals to Mazatlán</h1>
<div id="updated" class="updated">Last Updated: Loading...</div>
<div id="status" class="status">Loading arrivals...</div>
<div id="list"></div>
<button class="refresh" onclick="loadCSV()">↻ Refresh</button>
</div>
<script>
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'){if(q&&n=='"'){c+='"';i++}else q=!q}else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=""}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function pd(s){s=(s||"").trim();let d=new Date(s);if(!isNaN(d))return d;let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2])}return new Date(8640000000000000)}
function fd(s){let d=pd(s);return d.getTime()===8640000000000000?s||"":d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function loadCSV(){let st=document.getElementById("status");try{let r=await fetch("Arrivals_To_Maz.csv?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();let rows=parseCSV(await r.text());if(rows.length<2)throw Error();let d=rows.slice(1).map(x=>({name:(x[5]||"").trim(),date:(x[6]||"").trim(),notes:(x[7]||"").trim()})).filter(x=>x.name||x.date||x.notes);d.sort((a,b)=>pd(a.date)-pd(b.date));document.getElementById("list").innerHTML=d.length?d.map(x=>'<div class="card"><div class="name">'+esc(x.name)+'</div><div class="date">Arrival: '+esc(fd(x.date))+'</div>'+(x.notes?'<div class="notes">'+esc(x.notes)+'</div>':'')+'</div>').join(""):'<div class="empty">No arrivals found.</div>';st.style.display="none";document.getElementById("updated").textContent="Last Updated: "+new Date().toLocaleString()}catch(e){st.textContent="Could not load Arrivals_To_Maz.csv.";st.style.display="block";document.getElementById("updated").textContent="Last Updated: Unable to load"}}
loadCSV();
</script>
</body></html>
